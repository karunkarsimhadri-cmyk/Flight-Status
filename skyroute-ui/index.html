<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyRoute — Flight Status</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f172a;
      --surface: #1e293b;
      --border:  #334155;
      --text:    #f1f5f9;
      --muted:   #94a3b8;
      --green:   #22c55e;
      --amber:   #f59e0b;
      --red:     #ef4444;
      --grey:    #64748b;
      --blue:    #3b82f6;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
    header p  { color: var(--muted); margin-top: 0.4rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
      width: 100%;
      max-width: 540px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.4rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 0.9rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--blue); }
    input::placeholder { color: var(--muted); }

    button {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover:not(:disabled) { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Result card */
    #result { margin-top: 1.5rem; display: none; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.4rem;
      font-weight: 800;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }
    .status-badge.OnTime    { background: rgba(34,197,94,.15);  color: var(--green); }
    .status-badge.Delayed   { background: rgba(245,158,11,.15); color: var(--amber); }
    .status-badge.Cancelled { background: rgba(239,68,68,.15);  color: var(--red);   }
    .status-badge.Diverted  { background: rgba(239,68,68,.15);  color: var(--red);   }
    .status-badge.Unknown   { background: rgba(100,116,139,.15);color: var(--grey);  }

    .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem 1.25rem;
    }
    .detail-item label { color: var(--muted); font-size: 0.72rem; }
    .detail-item span  { font-size: 0.95rem; font-weight: 500; }

    .section-heading {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    .aerotrack-section {
      background: rgba(59,130,246,.06);
      border: 1px solid rgba(59,130,246,.18);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      margin-top: 1rem;
    }
    .aerotrack-section .section-heading { color: var(--blue); }

    .provider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .provider-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      background: rgba(59,130,246,.15);
      color: var(--blue);
      letter-spacing: 0.03em;
    }

    .message-box {
      margin-top: 0.9rem;
      background: rgba(100,116,139,.1);
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .divider { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }

    .source-line { color: var(--muted); font-size: 0.8rem; text-align: right; margin-top: 1rem; }

    /* Error */
    #error {
      margin-top: 1.25rem;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px;
      padding: 0.9rem 1.1rem;
      color: var(--red);
      font-size: 0.9rem;
      display: none;
    }

    /* Loading */
    #loading {
      text-align: center;
      color: var(--muted);
      margin-top: 1.25rem;
      display: none;
      font-size: 0.9rem;
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hint { font-size: 0.78rem; color: var(--muted); margin-top: 1.5rem; text-align: center; }
    .hint code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.1rem 0.4rem; font-size: 0.75rem; }
  </style>
</head>
<body>
  <header>
    <h1>✈ SkyRoute</h1>
    <p>Flight Status Tracker</p>
  </header>

  <div class="card">
    <div class="form-row">
      <div>
        <label for="flightNumber">Flight Number</label>
        <input id="flightNumber" type="text" placeholder="e.g. AA100" maxlength="10" />
      </div>
      <div>
        <label for="date">Date</label>
        <input id="date" type="date" />
      </div>
    </div>
    <button id="searchBtn" onclick="lookup()">Check Status</button>

    <div id="loading"><span class="spinner"></span> Looking up flight…</div>
    <div id="error"></div>

    <div id="result">
      <hr class="divider" />
      <div id="statusBadge" class="status-badge"></div>
      <div class="detail-grid" id="detailGrid"></div>
    </div>
  </div>

  <p class="hint">
    Try: <code>AA100</code> · <code>AA200</code> · <code>AA300</code> · <code>AA400</code> · <code>AA500</code> · <code>AA600</code> · <code>BA100</code>
  </p>

  <script>
    const API = 'http://localhost:5050';

    document.getElementById('date').value = new Date().toISOString().slice(0, 10);

    function show(id) {
      ['loading','error','result'].forEach(i =>
        document.getElementById(i).style.display = i === id ? '' : 'none');
    }

    function fmt(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function detail(label, value) {
      if (!value) return '';
      return `<div class="detail-item"><label>${label}</label><span>${value}</span></div>`;
    }

    async function lookup() {
      const flight = document.getElementById('flightNumber').value.trim().toUpperCase();
      const date   = document.getElementById('date').value;

      if (!flight || !date) {
        document.getElementById('error').textContent = 'Please enter both a flight number and date.';
        show('error');
        return;
      }

      show('loading');

      try {
        const res = await fetch(`${API}/flights/status?flightNumber=${encodeURIComponent(flight)}&date=${date}`);
        const data = await res.json();

        if (!res.ok) {
          document.getElementById('error').textContent = data.error ?? `Error ${res.status}`;
          show('error');
          return;
        }

        // Clear any previously injected dynamic sections
        document.querySelectorAll('.aerotrack-section,.message-box,.provider-row').forEach(el => el.remove());

        // Status badge
        const badge = document.getElementById('statusBadge');
        badge.className = `status-badge ${data.status}`;
        const icons = { OnTime: '✓', Delayed: '⚠', Cancelled: '✕', Diverted: '↪', Unknown: '?' };
        badge.innerHTML = `<span class="dot"></span>${icons[data.status] ?? ''} ${data.status}`;

        // Flight info + schedule
        const hasAeroTrack = data.terminal || data.gate || data.delayReason;

        const aeroSection = hasAeroTrack ? `
          <div class="aerotrack-section">
            <div class="section-heading">AeroTrack Details</div>
            <div class="detail-grid">
              ${detail('Terminal', data.terminal)}
              ${detail('Gate', data.gate)}
              ${data.delayReason
                ? `<div class="detail-item" style="grid-column:1/-1"><label>Delay Reason</label><span>${data.delayReason}</span></div>`
                : ''}
            </div>
          </div>` : '';

        const messageBox = data.message
          ? `<div class="message-box">${data.message}</div>` : '';

        document.getElementById('detailGrid').innerHTML = `
          <div class="section-heading" style="grid-column:1/-1">Flight Info</div>
          ${detail('Flight', data.flightNumber)}
          ${detail('Date', data.date)}
          <div class="section-heading" style="grid-column:1/-1; margin-top:0.5rem">Schedule</div>
          ${detail('Sched. Departure', fmt(data.scheduledDeparture))}
          ${detail('Actual Departure', fmt(data.actualDeparture))}
          ${detail('Sched. Arrival', fmt(data.scheduledArrival))}
          ${detail('Actual Arrival', fmt(data.actualArrival))}
        `;

        // Append AeroTrack section + message + provider row after the grid
        document.getElementById('detailGrid').insertAdjacentHTML('afterend',
          aeroSection + messageBox + `
          <div class="provider-row">
            <span>Updated ${new Date(data.lastUpdatedUtc).toLocaleTimeString()}</span>
            <span class="provider-badge">${data.source}</span>
          </div>`
        );

        show('result');
      } catch (err) {
        document.getElementById('error').textContent =
          'Could not reach the API. Make sure the backend is running on port 5050.';
        show('error');
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') lookup();
    });
  </script>
</body>
</html>
